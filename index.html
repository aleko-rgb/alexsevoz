<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Alex Sevoz — Photography</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Barlow+Condensed:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'Backstreet';
    src:url('fonts/Backstreet.ttf') format('truetype');
    font-weight:normal;font-style:normal;font-display:swap;
  }
  :root{--ink:#0e0e0e;--paper:#faf8f4;--wine:#6d1f2c;--accent:#2f6690;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--ink);color:var(--paper);font-family:'Jost',sans-serif;overflow:hidden;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  @media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}}

  /* TOP BAR */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;justify-content:center;
    padding:1.4rem 6vw;
    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(0,0,0,0.08);
  }
  .topbar .name{
    font-family:'Backstreet','Cormorant Garamond',serif;
    font-size:clamp(1.8rem,3.2vw,2.8rem);
    font-weight:300;color:#0e0e0e;letter-spacing:0.04em;
  }
  .topbar .sep{
    font-size:0.85rem;color:rgba(0,0,0,0.25);
    margin:0 0.8rem;
  }
  .topbar .sub{
    font-family:'Jost',sans-serif;
    font-size:0.88rem;letter-spacing:0.18em;text-transform:uppercase;
    color:rgba(0,0,0,0.45);
  }

  /* LANG */
  .lang-switch{
    position:fixed;top:1.2rem;right:6vw;z-index:21;
    display:flex;gap:0.6rem;font-size:0.72rem;letter-spacing:0.1em;
  }
  .lang-switch button{background:none;border:none;cursor:pointer;color:rgba(0,0,0,0.45);font-family:'Jost',sans-serif;padding:2px 4px;transition:color .3s ease;}
  .lang-switch button.active{color:var(--accent);font-weight:500;}
  .lang-switch span{color:rgba(0,0,0,0.2);}
  @media(max-width:640px){.lang-switch{top:auto;bottom:1.4rem;right:0;left:0;justify-content:center;}}

  /* SPLIT */
  .split{position:relative;height:100svh;display:flex;gap:3px;background:#fff;}
  .door{position:relative;flex:1;overflow:hidden;cursor:pointer;transition:flex 0.6s cubic-bezier(.6,0,.2,1);display:flex;align-items:flex-end;}
  .split:hover .door{flex:0.82;}
  .split .door:hover{flex:1.18;}

  /* BACKGROUNDS */
  .door-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 1s ease;}
  .door:hover .door-bg{transform:scale(1.04);}
  .door-wedding .door-bg{background-image:url('images/wedding/home-wedding.webp');}
  .door-dogs .door-bg{background-image:url('images/dog/home-dog.webp');}

  /* OVERLAYS — only at bottom for text readability on hover */
  .door-wedding::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(14,14,14,0.7) 100%);opacity:0;transition:opacity 0.5s ease;z-index:1;}
  .door-dogs::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(14,14,14,0.7) 100%);opacity:0;transition:opacity 0.5s ease;z-index:1;}
  .door-wedding:hover::after,.door-dogs:hover::after{opacity:1;}

  /* CONTENT — hidden by default, shown on hover */
  .door-content{position:relative;z-index:2;padding:0 5vw 5.5rem;width:100%;}
  .door-content h2{
    font-family:'Backstreet','Cormorant Garamond',serif;
    font-weight:400;font-style:normal;
    font-size:clamp(2.8rem,6.5vw,5rem);
    line-height:1.05;color:#fff;
    opacity:0;transform:translateY(14px);
    transition:opacity 0.45s ease,transform 0.45s ease;
  }
  .door-dogs .door-content h2{font-style:normal;}
  .door-sub{
    margin-top:1rem;max-width:32ch;font-size:1.05rem;line-height:1.6;
    color:rgba(255,255,255,0.9);
    opacity:0;transform:translateY(14px);
    transition:opacity 0.45s ease 0.06s,transform 0.45s ease 0.06s;
  }
  .door-cta{
    margin-top:1.8rem;display:inline-flex;align-items:center;gap:10px;
    font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;
    color:#fff;border-bottom:1px solid rgba(255,255,255,0.4);padding-bottom:6px;
    opacity:0;transform:translateY(10px);
    transition:opacity 0.4s ease 0.1s,transform 0.4s ease 0.1s;
  }
  .door:hover .door-content h2,
  .door:hover .door-sub,
  .door:hover .door-cta{opacity:1;transform:translateY(0);}

  @media(max-width:820px){
    .split{flex-direction:column;}
    .split:hover .door,.split .door:hover{flex:1;}
    .door{flex:1 !important;}
    .topbar{padding:1rem 6vw;}
    .topbar .sub{display:none;}
    .topbar .sep{display:none;}
    .door-content{padding-bottom:2.6rem;}
    .door-content h2,.door-sub,.door-cta{opacity:1;transform:none;}
    .door-wedding::after,.door-dogs::after{opacity:1;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="name">Alex Sevoz</div>
  <div class="sep">—</div>
  <div class="sub" data-i18n="topbar_sub"></div>
</div>

<div class="lang-switch">
  <button data-lang="pl">PL</button><span>·</span>
  <button data-lang="fr">FR</button><span>·</span>
  <button data-lang="en">EN</button>
</div>

<div class="split">
  <a class="door door-wedding" href="wedding.html">
    <div class="door-bg"></div>
    <div class="door-content">
      <h2 data-i18n="wedding_title"></h2>
      <p class="door-sub" data-i18n="wedding_sub"></p>
      <div class="door-cta" data-i18n="wedding_cta"></div>
    </div>
  </a>
  <a class="door door-dogs" href="dogs.html">
    <div class="door-bg"></div>
    <div class="door-content">
      <h2 data-i18n="dogs_title"></h2>
      <p class="door-sub" data-i18n="dogs_sub"></p>
      <div class="door-cta" data-i18n="dogs_cta"></div>
    </div>
  </a>
</div>

<script>
  const translations = {
    pl:{
      page_title:"Alex Sevoz — Fotograf",
      topbar_sub:"Fotograf",
      wedding_title:"Śluby",
      wedding_sub:"To Wasza historia. Jestem tam, by uchwycić jej momenty.",
      wedding_cta:"Zobacz więcej →",
      dogs_title:"Psy w locie",
      dogs_sub:"Kto powiedział, że psy nie latają?",
      dogs_cta:"Zobacz więcej →"
    },
    fr:{
      page_title:"Alex Sevoz — Photographe",
      topbar_sub:"Photographe",
      wedding_title:"Mariages",
      wedding_sub:"Vous écrivez l'histoire. Je suis là pour cadrer les moments.",
      wedding_cta:"Voir plus →",
      dogs_title:"Chiens en vol",
      dogs_sub:"Qui a dit que les chiens ne volaient pas ?",
      dogs_cta:"Voir plus →"
    },
    en:{
      page_title:"Alex Sevoz — Photography",
      topbar_sub:"Photographer",
      wedding_title:"Weddings",
      wedding_sub:"You write the story. I'm there to frame the moments.",
      wedding_cta:"See more →",
      dogs_title:"Flying Dogs",
      dogs_sub:"Who says dogs can't fly?",
      dogs_cta:"See more →"
    }
  };
  function setLang(lang){
    const dict=translations[lang];
    document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(dict[k]!==undefined)el.innerHTML=dict[k];});
    document.getElementById('pageTitle').textContent=dict.page_title;
    document.getElementById('htmlRoot').setAttribute('lang',lang);
    document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('active',b.getAttribute('data-lang')===lang));
  }
  document.querySelectorAll('.lang-switch button').forEach(btn=>btn.addEventListener('click',()=>setLang(btn.getAttribute('data-lang'))));
  setLang('en');
</script>
</body>
</html>
