<!DOCTYPE html>
<html>
<head>
<style>body{background:#eee;display:flex;flex-direction:column;align-items:center;gap:20px;padding:40px;font-family:sans-serif;}</style>
<style>@font-face{font-family:'Backstreet';src:url('fonts/Backstreet.ttf') format('truetype');}</style>
</head>
<body>
<h3>Favicon Generator — Alex Sevoz</h3>
<canvas id="c180" width="180" height="180" style="border-radius:90px;"></canvas>
<canvas id="c32" width="32" height="32" style="border-radius:16px;width:64px;height:64px;image-rendering:pixelated;"></canvas>
<button onclick="download180()">Download favicon-180.png</button>
<button onclick="download32()">Download favicon-32.png</button>
<script>
function draw(canvas, fontSize) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,s,s);
  // black circle
  ctx.beginPath();
  ctx.arc(s/2, s/2, s/2, 0, Math.PI*2);
  ctx.fillStyle = '#0e0e0e';
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.arc(s/2, s/2, s/2, 0, Math.PI*2);
  ctx.clip();
  // measure text to center it precisely
  ctx.font = `${fontSize}px Backstreet`;
  ctx.fillStyle = '#ffffff';
  ctx.textBaseline = 'alphabetic';
  const m = ctx.measureText('AS');
  const w = m.width;
  const asc = m.actualBoundingBoxAscent;
  const desc = m.actualBoundingBoxDescent;
  const h = asc + desc;
  const x = (s - w) / 2;
  const y = (s - h) / 2 + asc;
  ctx.fillText('AS', x, y);
  ctx.restore();
}

document.fonts.load("100px Backstreet").then(() => {
  draw(document.getElementById('c180'), 58);
  draw(document.getElementById('c32'), 10);
});

function download180() {
  const c = document.getElementById('c180');
  const a = document.createElement('a');
  a.download = 'favicon-180.png';
  a.href = c.toDataURL('image/png');
  a.click();
}
function download32() {
  const c = document.getElementById('c32');
  const a = document.createElement('a');
  a.download = 'favicon-32.png';
  a.href = c.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
