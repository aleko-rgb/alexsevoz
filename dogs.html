<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Alex Sevoz — Flying Dog Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Backstreet';src:url('fonts/Backstreet.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap;}
  :root{
    --ink:#26241f;--paper:#f4ede0;--paper-dim:#c9c0ae;
    --accent:#2f6690;--rust:#c1502e;--moss:#767d5f;
    --line:rgba(244,237,224,0.14);--line-dark:rgba(0,0,0,0.1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:linear-gradient(180deg,#201e1b 0%,#363430 28%,#4d4b41 58%,#63604f 100%);color:var(--paper);font-family:'Space Grotesk',sans-serif;font-weight:400;overflow-x:hidden;}
  h1,h2,h3,.display{font-family:'Barlow Condensed',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  @media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}}

  /* NAV */
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;flex-direction:column;padding:24px 6vw 0;transition:background 0.4s ease,box-shadow 0.4s ease;}
  nav.scrolled{background:rgba(38,36,31,0.92);backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--line);}
  .nav-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;}
  nav.scrolled .nav-top{padding-bottom:10px;}
  .nav-sub{font-size:0.65rem;letter-spacing:0.22em;text-transform:uppercase;color:rgba(255,255,255,0.75);text-align:center;padding:6px 0 10px;border-top:1px solid var(--line);opacity:0;max-height:0;overflow:hidden;transition:opacity 0.4s ease,max-height 0.4s ease,padding 0.4s ease;}
  nav.scrolled .nav-sub{opacity:1;max-height:40px;padding:8px 0 10px;}
  .logo{font-family:'Backstreet','Cormorant Garamond',serif;font-size:1.5rem;letter-spacing:0.04em;color:var(--paper);}
  .nav-right{display:flex;align-items:center;gap:2.4rem;}
  .nav-links{display:flex;gap:2.4rem;font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;}
  .nav-links a{position:relative;padding-bottom:4px;color:var(--paper-dim);transition:color .3s ease;}
  .nav-links a:hover{color:var(--accent);}
  .lang-switch{display:flex;gap:0.6rem;font-size:0.72rem;letter-spacing:0.1em;}
  .lang-switch button{background:none;border:none;cursor:pointer;color:var(--paper-dim);font-family:'JetBrains Mono',monospace;padding:2px 4px;transition:color .3s ease;}
  .lang-switch button.active{color:var(--accent);font-weight:500;}
  .lang-switch span{color:var(--line);}
  .nav-toggle{display:none;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--paper);}
  @media(max-width:820px){
    .nav-links{position:fixed;inset:0;background:var(--ink);color:var(--paper);flex-direction:column;justify-content:center;align-items:center;gap:2.2rem;font-size:1.1rem;opacity:0;pointer-events:none;transition:opacity 0.4s ease;z-index:105;}
    .nav-links.open{opacity:1;pointer-events:all;}
    .nav-toggle{display:block;z-index:110;}
    .lang-switch.desktop-lang{display:none;}
    .lang-switch.mobile-lang{position:fixed;bottom:2.4rem;left:0;right:0;justify-content:center;z-index:110;opacity:0;pointer-events:none;transition:opacity .4s ease;}
    .lang-switch.mobile-lang.open{opacity:1;pointer-events:all;}
    .nav-sub{display:none;}
    nav{padding:18px 6vw 0;}
  }
  @media(min-width:821px){.lang-switch.mobile-lang{display:none;}}

  /* HERO */
  .hero{position:relative;height:100svh;overflow:hidden;display:flex;align-items:flex-end;background:var(--ink);}
  .hero-bg{position:absolute;inset:0;background-image:url('images/dog/slideshow-2.webp');background-size:cover;background-position:center 30%;filter:grayscale(0.15) contrast(1.05);transform:scale(1.04);}
  .hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(38,36,31,0.22) 0%,rgba(38,36,31,0.4) 55%,rgba(38,36,31,0.82) 100%);}
  .flight-arc-banner{width:100%;height:140px;pointer-events:none;overflow:hidden;}
  .flight-arc-banner svg{width:100%;height:100%;}
  .arc-path{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 10;opacity:0.45;}
  .dog-part{fill:var(--accent);}
  .arc-anim{offset-path:path('M -40 130 Q 500 10 1040 130');offset-rotate:auto;animation:flyArc 5.5s ease-in-out infinite;}
  @keyframes flyArc{0%{offset-distance:0%;opacity:0;}8%{opacity:1;}92%{opacity:1;}100%{offset-distance:100%;opacity:0;}}
  .hero-content{position:relative;z-index:2;padding:0 6vw 3rem;color:var(--paper);width:100%;}
  .hero-tag{font-family:'JetBrains Mono',monospace;font-size:0.78rem;letter-spacing:0.08em;color:var(--accent);margin-bottom:1.3rem;display:inline-flex;gap:10px;align-items:center;opacity:0;animation:riseIn 0.9s ease 0.3s forwards;}
  .hero-tag::before{content:'●';font-size:0.6rem;}
  .hero h1{font-size:clamp(2rem,6vw,4.8rem);font-weight:500;line-height:0.95;max-width:20ch;color:var(--paper);opacity:0;animation:riseIn 0.9s ease 0.5s forwards;}
  .hero h1 em{font-style:normal;color:var(--accent);}
  .hero-sub{margin-top:1.6rem;max-width:44ch;font-size:1.05rem;line-height:1.6;color:var(--paper-dim);opacity:0;animation:riseIn 0.9s ease 0.75s forwards;}
  @keyframes riseIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  .scroll-cue{position:absolute;bottom:2rem;right:6vw;z-index:2;color:var(--paper-dim);font-family:'JetBrains Mono',monospace;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;opacity:0;animation:riseIn 0.9s ease 1.1s forwards;}

  /* SECTIONS */
  section{padding:8rem 6vw;}
  .section-head{max-width:640px;margin-bottom:4rem;}
  .tag{font-family:'JetBrains Mono',monospace;font-size:0.76rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:12px;margin-bottom:1.2rem;}
  .tag::before{content:'';width:24px;height:2px;background:var(--accent);}
  .section-head h2{font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.05;}
  .section-head p{margin-top:1.3rem;color:var(--paper-dim);line-height:1.7;font-size:1.02rem;max-width:52ch;}
  .reveal{opacity:0;transform:translateY(28px);transition:opacity 0.8s ease,transform 0.8s ease;}
  .reveal.visible{opacity:1;transform:translateY(0);}

  /* ANATOMY */
  .jump-seq{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
  @media(max-width:900px){.jump-seq{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.jump-seq{grid-template-columns:1fr;}}
  .jstep{background:var(--ink);padding:2.4rem 1.8rem;transition:background .35s ease;}
  .jstep:hover{background:#33312a;}
  .jstep .n{font-family:'JetBrains Mono',monospace;color:var(--accent);font-size:0.82rem;letter-spacing:0.08em;margin-bottom:1.4rem;}
  .jstep h3{font-size:1.5rem;margin-bottom:0.7rem;}
  .jstep p{color:var(--paper-dim);line-height:1.65;font-size:0.94rem;}

  /* PORTFOLIO — masonry columns, no gap/hole */
  .grid{columns:3;column-gap:14px;}
  @media(max-width:900px){.grid{columns:2;}}
  @media(max-width:520px){.grid{columns:1;}}
  .grid figure{break-inside:avoid;position:relative;overflow:hidden;background:#000;cursor:pointer;margin-bottom:14px;}
  .grid figure img{width:100%;height:auto;display:block;transition:transform 1s cubic-bezier(.16,.84,.44,1),filter .5s ease;filter:saturate(1.05) contrast(1.03);}
  .grid figure:hover img{transform:scale(1.07);}
  .grid figcaption{position:absolute;left:0;right:0;bottom:0;padding:0.9rem 1rem;background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);color:var(--paper);font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.03em;opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease;}
  .grid figcaption .cap-name{display:block;font-family:'Space Grotesk',sans-serif;font-size:0.85rem;margin-bottom:0.2rem;color:var(--accent);}
  .grid figure:hover figcaption{opacity:1;transform:translateY(0);}

  .lightbox{position:fixed;inset:0;z-index:200;background:rgba(10,10,10,0.97);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.4s ease;}
  .lightbox.open{opacity:1;pointer-events:all;}
  .lightbox img{max-width:90vw;max-height:88vh;object-fit:contain;transform:scale(0.96);transition:transform 0.4s ease;}
  .lightbox.open img{transform:scale(1);}
  .lb-close{position:absolute;top:1.6rem;right:2rem;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;opacity:0.6;transition:opacity .3s ease;line-height:1;}
  .lb-close:hover{opacity:1;}
  .lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:2.2rem;cursor:pointer;opacity:0.5;transition:opacity .3s ease;padding:1rem;}
  .lb-prev{left:1rem;}.lb-next{right:1rem;}
  .lb-prev:hover,.lb-next:hover{opacity:1;}
  .lb-counter{position:absolute;bottom:1.6rem;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:0.78rem;letter-spacing:0.1em;}

  /* TECHNIQUE NOTE */
  .technique-note{background:rgba(47,102,144,0.08);border:1px solid rgba(47,102,144,0.25);padding:2rem 2.4rem;margin-top:3rem;font-size:0.95rem;line-height:1.75;color:var(--paper);}
  .technique-note strong{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:0.8rem;letter-spacing:0.06em;text-transform:uppercase;display:block;margin-bottom:0.5rem;}

  /* SESSIONS */
  .session-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:4rem;align-items:start;}
  @media(max-width:900px){.session-grid{grid-template-columns:1fr;}}
  .session-list{display:flex;flex-direction:column;}
  .session-item{padding:1.6rem 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:2rem;align-items:baseline;}
  .session-list .session-item:last-child{border-bottom:1px solid var(--line);}
  .session-item .label{font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;letter-spacing:0.01em;}
  .session-item .desc{color:var(--paper-dim);font-size:0.9rem;text-align:right;max-width:26ch;line-height:1.5;}
  .session-note{background:rgba(226,163,59,0.08);border:1px solid rgba(226,163,59,0.3);padding:1.8rem;font-size:0.95rem;line-height:1.7;color:var(--paper);}
  .session-note strong{color:var(--accent);}

  /* TESTIMONIALS */
  .testi-wrap{position:relative;background:#33312a;padding:5rem 6vw;overflow:hidden;border:1px solid var(--line);}
  .testi-track{display:flex;transition:transform 0.7s cubic-bezier(.6,0,.2,1);width:100%;will-change:transform;}
  .testi{width:100%;flex:0 0 100%;box-sizing:border-box;}
  .testi p{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.2rem,2.2vw,1.55rem);line-height:1.5;font-weight:400;}
  .testi .who{margin-top:1.8rem;font-family:'JetBrains Mono',monospace;font-size:0.78rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent);}
  .testi-nav{display:flex;gap:10px;margin-top:2.6rem;position:relative;z-index:2;}
  .testi-dot{width:8px;height:8px;border-radius:50%;background:var(--line);border:none;cursor:pointer;transition:background .3s ease,transform .3s ease;}
  .testi-dot.active{background:var(--accent);transform:scale(1.3);}

  /* CONTACT */
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start;}
  @media(max-width:820px){.contact-grid{grid-template-columns:1fr;gap:3rem;}}
  .field{margin-bottom:1.6rem;}
  .field label{display:block;font-family:'JetBrains Mono',monospace;font-size:0.72rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--paper-dim);margin-bottom:0.6rem;}
  .field input,.field textarea{width:100%;border:none;border-bottom:1px solid var(--line);background:transparent;padding:0.6rem 0.2rem;font-family:'Space Grotesk',sans-serif;font-size:1rem;color:var(--paper);transition:border-color .3s ease;}
  .field input::placeholder,.field textarea::placeholder{color:var(--paper-dim);opacity:0.5;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:100px;}
  .submit-btn{margin-top:1rem;padding:0.9rem 2.2rem;background:var(--accent);color:var(--ink);border:none;font-family:'JetBrains Mono',monospace;font-size:0.8rem;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:background .3s ease,transform .3s ease;}
  .submit-btn:hover{background:#9db3c2;transform:translateY(-2px);}
  .submit-btn:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .form-msg{margin-top:1rem;font-size:0.88rem;padding:0.6rem 1rem;}
  .form-msg.success{color:#2a6e3f;background:rgba(42,110,63,0.08);border-left:3px solid #2a6e3f;}
  .form-msg.error{color:#c1502e;background:rgba(193,80,46,0.08);border-left:3px solid #c1502e;}
  .submit-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
  .contact-info h3{font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;margin-bottom:1.4rem;}
  .contact-info p{color:var(--paper-dim);line-height:1.7;margin-bottom:2rem;max-width:42ch;}
  .contact-info .line{padding:0.9rem 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:0.92rem;}
  .contact-info .line:last-child{border-bottom:1px solid var(--line);}

  footer{padding:3rem 6vw;text-align:center;color:var(--paper-dim);font-size:0.8rem;border-top:1px solid var(--line);}
  .footer-cross{margin-top:0.7rem;}
  .footer-cross a{color:var(--paper-dim);border-bottom:1px solid var(--line);padding-bottom:1px;transition:color .3s ease,border-color .3s ease;}
  .footer-cross a:hover{color:var(--accent);border-color:var(--accent);}
</style>
</head>
<body>

<nav id="nav">
  <div class="nav-top">
    <a href="index.html" class="logo">Alex Sevoz</a>
    <div class="nav-right">
      <div class="nav-links" id="navLinks">
        <a href="#anatomy" data-i18n="nav_anatomy" onclick="closeMenu()"></a>
        <a href="#portfolio" data-i18n="nav_portfolio" onclick="closeMenu()"></a>
        <a href="#sessions" data-i18n="nav_sessions" onclick="closeMenu()"></a>
        <a href="#contact" data-i18n="nav_contact" onclick="closeMenu()"></a>
      </div>
      <div class="lang-switch desktop-lang" id="langSwitchDesktop">
        <button data-lang="pl">PL</button><span>·</span>
        <button data-lang="fr">FR</button><span>·</span>
        <button data-lang="en">EN</button>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
    </div>
  </div>
  <div class="nav-sub" data-i18n="subnav_banner"></div>
</nav>
<div class="lang-switch mobile-lang" id="langSwitchMobile">
  <button data-lang="pl">PL</button><span>·</span>
  <button data-lang="fr">FR</button><span>·</span>
  <button data-lang="en">EN</button>
</div>

<header class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <h1 data-i18n="hero_title"></h1>
    <p class="hero-sub" data-i18n="hero_sub"></p>
  </div>
  <div class="scroll-cue mono" data-i18n="scroll_cue"></div>
</header>

<div class="flight-arc-banner">
  <svg viewBox="0 0 1000 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path class="arc-path" d="M -40 130 Q 500 10 1040 130"></path>
    <g class="arc-anim">
      <path class="dog-part" d="M -13,-6 Q -20,-13 -16,-18 Q -14,-13 -9,-7 Z"></path>
      <ellipse class="dog-part" cx="-2" cy="0" rx="13" ry="6"></ellipse>
      <path class="dog-part" d="M -12,3 L -19,-3 L -16,-6 L -9,1 Z"></path>
      <path class="dog-part" d="M 5,4 L 11,15 L 7,15 L 2,5 Z"></path>
      <circle class="dog-part" cx="14" cy="-5" r="5.5"></circle>
      <ellipse class="dog-part" cx="20" cy="-3" rx="3" ry="2"></ellipse>
      <path class="dog-part" d="M 11,-10 L 16,-10 L 13,-15 Z"></path>
    </g>
  </svg>
</div>

<section id="anatomy">
  <div class="section-head reveal">
    <div class="tag" data-i18n="anatomy_tag"></div>
    <h2 data-i18n="anatomy_h2"></h2>
    <p data-i18n="anatomy_p"></p>
  </div>
  <div class="jump-seq reveal">
    <div class="jstep"><div class="n" data-i18n="step1_n"></div><h3 data-i18n="step1_h"></h3><p data-i18n="step1_p"></p></div>
    <div class="jstep"><div class="n" data-i18n="step2_n"></div><h3 data-i18n="step2_h"></h3><p data-i18n="step2_p"></p></div>
    <div class="jstep"><div class="n" data-i18n="step3_n"></div><h3 data-i18n="step3_h"></h3><p data-i18n="step3_p"></p></div>
    <div class="jstep"><div class="n" data-i18n="step4_n"></div><h3 data-i18n="step4_h"></h3><p data-i18n="step4_p"></p></div>
  </div>
</section>

<section id="portfolio">
  <div class="section-head reveal">
    <div class="tag" data-i18n="portfolio_tag"></div>
    <h2 data-i18n="portfolio_h2"></h2>
    <p data-i18n="portfolio_p"></p>
  </div>
  <div class="grid" id="portfolioGrid"></div>
  <div class="technique-note reveal">
    <strong data-i18n="technique_label"></strong>
    <span data-i18n="technique_text"></span>
  </div>
</section>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-prev" id="lbPrev">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-next" id="lbNext">›</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<section id="sessions">
  <div class="section-head reveal">
    <div class="tag" data-i18n="sessions_tag"></div>
    <h2 data-i18n="sessions_h2"></h2>
    <p data-i18n="sessions_p"></p>
  </div>
  <div class="session-grid reveal">
    <div class="session-list">
      <div class="session-item"><div class="label" data-i18n="s1_label"></div><div class="desc" data-i18n="s1_desc"></div></div>
      <div class="session-item"><div class="label" data-i18n="s2_label"></div><div class="desc" data-i18n="s2_desc"></div></div>
      <div class="session-item"><div class="label" data-i18n="s3_label"></div><div class="desc" data-i18n="s3_desc"></div></div>
    </div>
    <div class="session-note" data-i18n="session_note"></div>
  </div>
</section>

<section id="avis">
  <div class="section-head reveal">
    <div class="tag" data-i18n="avis_tag"></div>
    <h2 data-i18n="avis_h2"></h2>
  </div>
  <div class="testi-wrap reveal">
    <div class="testi-track" id="testiTrack">
      <div class="testi"><p data-i18n="testi1_p"></p><div class="who" data-i18n="testi1_who"></div></div>
      <div class="testi"><p data-i18n="testi2_p"></p><div class="who" data-i18n="testi2_who"></div></div>
      <div class="testi"><p data-i18n="testi3_p"></p><div class="who" data-i18n="testi3_who"></div></div>
    </div>
    <div class="testi-nav" id="testiNav"></div>
  </div>
</section>

<section id="contact">
  <div class="section-head reveal">
    <div class="tag" data-i18n="contact_tag"></div>
    <h2 data-i18n="contact_h2"></h2>
    <p data-i18n="contact_p"></p>
  </div>
  <div class="contact-grid reveal">
    <form id="dogForm">
      <div class="field">
        <label for="dname" data-i18n="label_dname"></label>
        <input type="text" id="dname" data-i18n-placeholder="placeholder_dname">
      </div>
      <div class="field">
        <label for="breed" data-i18n="label_breed"></label>
        <input type="text" id="breed" data-i18n-placeholder="placeholder_breed">
      </div>
      <div class="field">
        <label for="f_email" data-i18n="label_email"></label>
        <input type="email" id="f_email" data-i18n-placeholder="placeholder_email">
      </div>
      <div class="field">
        <label for="f_phone" data-i18n="label_phone"></label>
        <input type="tel" id="f_phone" data-i18n-placeholder="placeholder_phone">
      </div>

  function setLang(lang){

    document.getElementById('htmlRoot').setAttribute('lang', lang);

      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
