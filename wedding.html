<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Alex Sevoz — Wedding Photographer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=La+Belle+Aurore&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e0e0e;
    --paper:#ffffff;
    --wine:#6d1f2c;
    --sand:#a8525f;
    --grey:#767676;
    --line:rgba(0,0,0,0.1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--paper);color:var(--ink);font-family:'Jost',sans-serif;font-weight:400;overflow-x:hidden;}
  h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;font-weight:400;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  @media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}}

  /* NAV */
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:26px 6vw;transition:background 0.5s ease,padding 0.4s ease,box-shadow 0.4s ease;}
  nav.scrolled{background:rgba(255,255,255,0.94);backdrop-filter:blur(8px);padding:16px 6vw;box-shadow:0 1px 0 var(--line);}
  .logo{font-family:'Cormorant Garamond',serif;font-size:1.5rem;letter-spacing:0.05em;}
  .nav-right{display:flex;align-items:center;gap:2.4rem;}
  .nav-links{display:flex;gap:2.6rem;font-size:0.82rem;letter-spacing:0.08em;text-transform:uppercase;}
  .nav-links a{position:relative;padding-bottom:4px;color:inherit;}
  .nav-links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--wine);transition:width 0.35s ease;}
  .nav-links a:hover::after{width:100%;}
  .lang-switch{display:flex;gap:0.6rem;font-size:0.72rem;letter-spacing:0.1em;}
  .lang-switch button{background:none;border:none;cursor:pointer;color:var(--grey);font-family:'Jost',sans-serif;padding:2px 4px;transition:color .3s ease;}
  .lang-switch button.active{color:var(--wine);font-weight:500;}
  .lang-switch span{color:var(--line);}
  .nav-toggle{display:none;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--ink);z-index:110;}
  @media(max-width:820px){
    .nav-links{position:fixed;inset:0;background:var(--ink);color:var(--paper);flex-direction:column;justify-content:center;align-items:center;gap:2.2rem;font-size:1.1rem;opacity:0;pointer-events:none;transition:opacity 0.4s ease;z-index:105;}
    .nav-links.open{opacity:1;pointer-events:all;}
    .nav-toggle{display:block;}
    .lang-switch.desktop-lang{display:none;}
    .lang-switch.mobile-lang{position:fixed;bottom:2.4rem;left:0;right:0;justify-content:center;z-index:110;opacity:0;pointer-events:none;transition:opacity .4s ease;}
    .lang-switch.mobile-lang.open{opacity:1;pointer-events:all;}
    .lang-switch.mobile-lang button{color:rgba(255,255,255,0.6);}
    .lang-switch.mobile-lang button.active{color:var(--sand);}
  }
  @media(min-width:821px){.lang-switch.mobile-lang{display:none;}}

  /* SUBNAV BANNER */
  .subnav-banner{
    position:fixed;top:0;left:0;right:0;z-index:99;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
    padding-top:80px;
  }
  .subnav-banner span{
    font-size:0.68rem;letter-spacing:0.28em;text-transform:uppercase;
    color:var(--sand);opacity:0;
    transition:opacity 0.5s ease;
  }
  nav.scrolled ~ .subnav-banner span{opacity:1;}

  /* HERO */
  .hero{position:relative;height:100svh;overflow:hidden;}
  .slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;animation:slideFade 24s infinite;filter:saturate(0.9);}
  .slide::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,14,14,0.15),rgba(14,14,14,0.6));}
  .slide:nth-child(1){animation-delay:0s;  background-image:url('images/wedding/slideshow-1.webp');}
  .slide:nth-child(2){animation-delay:6s;  background-image:url('images/wedding/slideshow-2.webp');}
  .slide:nth-child(3){animation-delay:12s; background-image:url('images/wedding/slideshow-3.webp');}
  .slide:nth-child(4){animation-delay:18s; background-image:url('images/wedding/slideshow-4.webp');}
  @keyframes slideFade{0%{opacity:0;}4%{opacity:1;}25%{opacity:1;}29%{opacity:0;}100%{opacity:0;}}
  .hero-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 6vw 5rem;color:var(--paper);}
  .hero-eyebrow{font-size:0.78rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--sand);margin-bottom:1.2rem;opacity:0;animation:riseIn 1s ease 0.4s forwards;}
  .hero h1{font-size:clamp(2.4rem,6.4vw,5rem);font-weight:400;line-height:1.08;letter-spacing:0.04em;text-transform:uppercase;max-width:16ch;color:#fff;opacity:0;animation:riseIn 1s ease 0.6s forwards;}
  .hero-sub{margin-top:1.6rem;max-width:38ch;font-size:1.02rem;line-height:1.6;color:rgba(255,255,255,0.85);opacity:0;animation:riseIn 1s ease 0.85s forwards;}
  @keyframes riseIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  .scroll-cue{position:absolute;bottom:2rem;left:6vw;z-index:2;color:var(--paper);font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;display:flex;align-items:center;gap:10px;opacity:0;animation:riseIn 1s ease 1.2s forwards;}
  .scroll-cue .stem{width:1px;height:34px;background:rgba(255,255,255,0.5);position:relative;overflow:hidden;}
  .scroll-cue .stem::after{content:'';position:absolute;top:-100%;left:0;width:100%;height:100%;background:var(--sand);animation:stemDrop 2.2s ease-in-out infinite;}
  @keyframes stemDrop{0%{top:-100%;}60%{top:100%;}100%{top:100%;}}

  /* SECTIONS */
  section{padding:8.5rem 6vw;}
  .section-head{max-width:640px;margin-bottom:4rem;}
  .eyebrow{font-size:0.78rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--wine);display:flex;align-items:center;gap:12px;margin-bottom:1.2rem;}
  .eyebrow::before{content:'';width:28px;height:1px;background:var(--wine);}
  .section-head h2{font-size:clamp(2rem,4vw,3rem);font-weight:400;line-height:1.15;}
  .section-head p{margin-top:1.2rem;color:var(--grey);line-height:1.7;font-size:1.02rem;max-width:52ch;}

  /* REVEAL */
  .reveal{opacity:0;transform:translateY(32px);transition:opacity 0.9s ease,transform 0.9s ease;}
  .reveal.visible{opacity:1;transform:translateY(0);}
  .reveal-delay-1{transition-delay:0.15s;}
  .reveal-delay-2{transition-delay:0.25s;}

  /* THREAD */
  .thread-wrap{position:relative;}
  .thread-line{position:absolute;left:24px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--sand) 8%,var(--sand) 92%,transparent);}
  .thread-line .drop{position:absolute;left:50%;top:0;width:9px;height:9px;border-radius:50%;background:var(--wine);transform:translate(-50%,-50%);box-shadow:0 0 0 5px var(--paper);}
  .moments{display:flex;flex-direction:column;gap:3.2rem;padding-left:64px;position:relative;}
  .moment{position:relative;}
  .moment .num{position:absolute;left:-64px;top:0;width:48px;text-align:right;font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--sand);font-size:0.95rem;}
  .moment h3{font-size:1.3rem;font-weight:400;margin-bottom:0.5rem;}
  .moment p{color:var(--grey);line-height:1.7;max-width:56ch;font-size:0.98rem;}

  /* PORTFOLIO GRID */
  .grid{columns:3;column-gap:12px;}
  @media(max-width:900px){.grid{columns:2;}}
  @media(max-width:520px){.grid{columns:1;}}
  .grid figure{break-inside:avoid;position:relative;overflow:hidden;background:var(--ink);cursor:pointer;margin-bottom:12px;}
  .grid figure img{width:100%;height:auto;display:block;transition:transform 1.1s cubic-bezier(.16,.84,.44,1),filter .6s ease;filter:saturate(0.95);}
  .grid figure:hover img{transform:scale(1.05);filter:saturate(1.1);}
  .grid figcaption{position:absolute;left:0;right:0;bottom:0;padding:1rem 1.2rem;background:linear-gradient(to top,rgba(14,14,14,0.75),transparent);color:#fff;font-size:0.78rem;letter-spacing:0.05em;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease;}
  .grid figure:hover figcaption{opacity:1;transform:translateY(0);}

  /* LIGHTBOX */
  .lightbox{position:fixed;inset:0;z-index:200;background:rgba(10,10,10,0.97);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.4s ease;}
  .lightbox.open{opacity:1;pointer-events:all;}
  .lightbox img{max-width:90vw;max-height:88vh;object-fit:contain;transform:scale(0.96);transition:transform 0.4s ease;}
  .lightbox.open img{transform:scale(1);}
  .lb-close{position:absolute;top:1.6rem;right:2rem;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;opacity:0.6;transition:opacity .3s ease;line-height:1;}
  .lb-close:hover{opacity:1;}
  .lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:2.2rem;cursor:pointer;opacity:0.5;transition:opacity .3s ease;padding:1rem;}
  .lb-prev{left:1rem;} .lb-next{right:1rem;}
  .lb-prev:hover,.lb-next:hover{opacity:1;}
  .lb-counter{position:absolute;bottom:1.6rem;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:0.78rem;letter-spacing:0.1em;}

  /* TESTIMONIALS */
  .testi-wrap{position:relative;background:var(--ink);color:#fff;border-radius:2px;padding:5rem 6vw;overflow:hidden;}
  .testi-wrap::before{content:'"';position:absolute;top:-2rem;left:2vw;font-family:'Cormorant Garamond',serif;font-size:16rem;color:rgba(255,255,255,0.05);line-height:1;}
  .testi-track{display:flex;transition:transform 0.7s cubic-bezier(.6,0,.2,1);}
  .testi{min-width:100%;max-width:680px;}
  .testi p{font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,2.4vw,1.7rem);line-height:1.5;font-weight:300;}
  .testi .who{margin-top:1.8rem;font-size:0.82rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--sand);}
  .testi-nav{display:flex;gap:10px;margin-top:2.6rem;position:relative;z-index:2;}
  .testi-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.3);border:none;cursor:pointer;transition:background .3s ease,transform .3s ease;}
  .testi-dot.active{background:var(--sand);transform:scale(1.3);}

  /* VOTRE HISTOIRE */
  #histoire{background:var(--paper);}
  .histoire-inner{display:grid;grid-template-columns:1fr 1.2fr;gap:6rem;align-items:start;}
  @media(max-width:820px){.histoire-inner{grid-template-columns:1fr;gap:3rem;}}
  .histoire-left h2{font-size:clamp(2rem,4vw,3rem);font-weight:400;line-height:1.15;margin-bottom:1.4rem;}
  .histoire-left p{color:var(--grey);line-height:1.7;font-size:1rem;max-width:42ch;margin-bottom:2.4rem;}
  .contact-lines{border-top:1px solid var(--line);}
  .contact-line{padding:0.9rem 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:0.9rem;}
  .contact-line span:first-child{color:var(--grey);font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;}
  .field{margin-bottom:1.8rem;}
  .field label{display:block;font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--grey);margin-bottom:0.7rem;}
  .field input,.field textarea{width:100%;border:none;border-bottom:1px solid var(--line);background:transparent;padding:0.6rem 0.2rem;font-family:'Jost',sans-serif;font-size:1rem;color:var(--ink);transition:border-color .3s ease;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--wine);}
  .field textarea{resize:vertical;min-height:110px;}
  .radio-group{display:flex;flex-wrap:wrap;gap:0.7rem;margin-top:0.2rem;}
  .radio-group label{display:flex;align-items:center;gap:0.5rem;font-size:0.88rem;letter-spacing:0;text-transform:none;color:var(--ink);cursor:pointer;padding:0.45rem 1rem;border:1px solid var(--line);transition:border-color .3s ease,color .3s ease;}
  .radio-group input[type="radio"]{width:auto;border:none;padding:0;accent-color:var(--wine);cursor:pointer;}
  .radio-group label:has(input:checked){border-color:var(--wine);color:var(--wine);}
  .submit-btn{margin-top:0.6rem;padding:1rem 2.6rem;background:var(--wine);color:#fff;border:none;font-family:'Jost',sans-serif;font-size:0.82rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:background .3s ease,transform .3s ease;}
  .submit-btn:hover{background:#4a1420;transform:translateY(-2px);}
  .submit-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
  .form-msg{margin-top:1rem;font-size:0.88rem;padding:0.6rem 1rem;}
  .form-msg.success{color:#2a6e3f;background:#edf7f0;border-left:3px solid #2a6e3f;}
  .form-msg.error{color:#7a1f1f;background:#fdf0f0;border-left:3px solid #a83232;}

  footer{padding:3rem 6vw;text-align:center;color:var(--grey);font-size:0.8rem;border-top:1px solid var(--line);}
  .footer-cross{margin-top:0.7rem;}
  .footer-cross a{color:var(--grey);border-bottom:1px solid var(--line);padding-bottom:1px;transition:color .3s ease,border-color .3s ease;}
  .footer-cross a:hover{color:var(--wine);border-color:var(--wine);}
</style>
</head>

const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
}, {threshold:0.1});

const grid = document.getElementById('portfolioGrid');
portfolioPhotos.forEach((photo, i) => {
  const fig = document.createElement('figure');
  fig.classList.add('reveal');
  const img = document.createElement('img');
  img.src = photo.src;
  img.alt = photo.cap || '';
  img.loading = 'lazy';
  fig.appendChild(img);
  if(photo.cap){ const cap = document.createElement('figcaption'); cap.textContent = photo.cap; fig.appendChild(cap); }
  fig.addEventListener('click', () => openLightbox(i));
  grid.appendChild(fig);
  io.observe(fig);
});

// ─── LIGHTBOX ────────────────────────────────────────────────────────
const lightbox = document.getElementById('lightbox');
const lbImg    = document.getElementById('lbImg');
const lbCounter= document.getElementById('lbCounter');
let lbIndex = 0;
function openLightbox(i){ lbIndex=i; lbImg.src=portfolioPhotos[i].src; lbCounter.textContent=(i+1)+' / '+portfolioPhotos.length; lightbox.classList.add('open'); document.body.style.overflow='hidden'; }
function closeLightbox(){ lightbox.classList.remove('open'); document.body.style.overflow=''; }
function lbMove(dir){ lbIndex=(lbIndex+dir+portfolioPhotos.length)%portfolioPhotos.length; lbImg.src=portfolioPhotos[lbIndex].src; lbCounter.textContent=(lbIndex+1)+' / '+portfolioPhotos.length; }
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => lbMove(-1));
document.getElementById('lbNext').addEventListener('click', () => lbMove(1));
lightbox.addEventListener('click', e => { if(e.target===lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
  if(!lightbox.classList.contains('open')) return;
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft') lbMove(-1);
  if(e.key==='ArrowRight') lbMove(1);
});

});

function setLang(lang){
  currentLang = lang;
  const dict = translations[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => { const k=el.getAttribute('data-i18n'); if(dict[k]!==undefined) el.innerHTML=dict[k]; });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const k=el.getAttribute('data-i18n-placeholder'); if(dict[k]!==undefined) el.setAttribute('placeholder',dict[k]); });
  document.getElementById('pageTitle').textContent = dict.page_title;
  document.getElementById('htmlRoot').setAttribute('lang', lang);
  document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('active', b.getAttribute('data-lang')===lang));
}
document.querySelectorAll('.lang-switch button').forEach(btn => btn.addEventListener('click', () => setLang(btn.getAttribute('data-lang'))));

const total = track.children.length;
let current = 0;
for(let i=0;i<total;i++){
  const dot = document.createElement('button');
  dot.className = 'testi-dot'+(i===0?' active':'');
  dot.addEventListener('click', () => goTo(i));
  testiNav.appendChild(dot);
}
function goTo(i){ current=i; track.style.transform=`translateX(-${i*100}%)`; [...testiNav.children].forEach((d,idx)=>d.classList.toggle('active',idx===i)); }
setInterval(() => goTo((current+1)%total), 6000);
