<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Alex Sevoz — Fotograf ślubny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e0e0e;
    --paper:#ffffff;
    --wine:#6d1f2c;
    --sand:#a8525f;
    --grey:#767676;
    --line: rgba(0,0,0,0.1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-weight:400;
    overflow-x:hidden;
  }
  h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;font-weight:400;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  /* ---------- NAV ---------- */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:26px 6vw;
    transition:background 0.5s ease, padding 0.4s ease, box-shadow 0.4s ease;
  }
  nav.scrolled{
    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(8px);
    padding:16px 6vw;
    box-shadow:0 1px 0 var(--line);
  }
  .logo{
    font-family:'Cormorant Garamond',serif;
    font-size:1.15rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
  }
  .nav-right{display:flex;align-items:center;gap:2.4rem;}
  .nav-links{display:flex;gap:2.6rem;font-size:0.82rem;letter-spacing:0.08em;text-transform:uppercase;}
  .nav-links a{position:relative;padding-bottom:4px;}
  .nav-links a::after{
    content:'';position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--wine);
    transition:width 0.35s ease;
  }
  .nav-links a:hover::after{width:100%;}

  .lang-switch{display:flex;gap:0.6rem;font-size:0.72rem;letter-spacing:0.1em;}
  .lang-switch button{
    background:none;border:none;cursor:pointer;color:var(--grey);
    font-family:'Jost',sans-serif;padding:2px 4px;transition:color .3s ease;
  }
  .lang-switch button.active{color:var(--wine);font-weight:500;}
  .lang-switch span{color:var(--line);}

  .nav-toggle{display:none;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--ink);}

  @media(max-width:820px){
    .nav-links{
      position:fixed;inset:0;
      background:var(--ink);
      color:var(--paper);
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:2.2rem;
      font-size:1.1rem;
      opacity:0;pointer-events:none;
      transition:opacity 0.4s ease;
    }
    .nav-links.open{opacity:1;pointer-events:all;}
    .nav-toggle{display:block;z-index:110;}
    .lang-switch{position:fixed;bottom:2.4rem;left:0;right:0;justify-content:center;z-index:110;opacity:0;pointer-events:none;transition:opacity .4s ease;}
    .lang-switch.open{opacity:1;pointer-events:all;}
    .lang-switch button{color:rgba(255,255,255,0.6);}
    .lang-switch button.active{color:var(--sand);}
  }

  /* ---------- HERO SLIDESHOW ---------- */
  .hero{position:relative;height:100svh;overflow:hidden;}
  .slide{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    opacity:0;
    animation:slideFade 24s infinite;
    filter:saturate(0.9);
  }
  .slide::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(14,14,14,0.15), rgba(14,14,14,0.6));}
  .slide:nth-child(1){animation-delay:0s; background-image:url('https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1600&auto=format&fit=crop');}
  .slide:nth-child(2){animation-delay:6s; background-image:url('https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?q=80&w=1600&auto=format&fit=crop');}
  .slide:nth-child(3){animation-delay:12s; background-image:url('https://images.unsplash.com/photo-1583939003579-730e3918a45a?q=80&w=1600&auto=format&fit=crop');}
  .slide:nth-child(4){animation-delay:18s; background-image:url('https://images.unsplash.com/photo-1606216794074-735e91aa2c92?q=80&w=1600&auto=format&fit=crop');}
  @keyframes slideFade{
    0%{opacity:0;} 4%{opacity:1;} 25%{opacity:1;} 29%{opacity:0;} 100%{opacity:0;}
  }
  .hero-content{
    position:relative;z-index:2;
    height:100%;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 6vw 5rem;
    color:var(--paper);
  }
  .hero-eyebrow{
    font-size:0.78rem;letter-spacing:0.22em;text-transform:uppercase;
    color:var(--sand);margin-bottom:1.2rem;
    opacity:0;animation:riseIn 1s ease 0.4s forwards;
  }
  .hero h1{
    font-size:clamp(2.4rem,6.4vw,5rem);
    font-weight:400;
    line-height:1.08;
    letter-spacing:0.04em;
    text-transform:uppercase;
    max-width:16ch;
    color:#ffffff;
    opacity:0;animation:riseIn 1s ease 0.6s forwards;
  }
  .hero-sub{
    margin-top:1.6rem;max-width:38ch;font-size:1.02rem;line-height:1.6;color:rgba(255,255,255,0.85);
    opacity:0;animation:riseIn 1s ease 0.85s forwards;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

  .scroll-cue{
    position:absolute;bottom:2rem;left:6vw;z-index:2;color:var(--paper);
    font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;
    display:flex;align-items:center;gap:10px;
    opacity:0;animation:riseIn 1s ease 1.2s forwards;
  }
  .scroll-cue .stem{width:1px;height:34px;background:rgba(255,255,255,0.5);position:relative;overflow:hidden;}
  .scroll-cue .stem::after{
    content:'';position:absolute;top:-100%;left:0;width:100%;height:100%;background:var(--sand);
    animation:stemDrop 2.2s ease-in-out infinite;
  }
  @keyframes stemDrop{0%{top:-100%;}60%{top:100%;}100%{top:100%;}}

  /* ---------- SECTION SHELL ---------- */
  section{padding:8.5rem 6vw;}
  .section-head{max-width:640px;margin-bottom:4rem;}
  .eyebrow{
    font-size:0.78rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--wine);
    display:flex;align-items:center;gap:12px;margin-bottom:1.2rem;
  }
  .eyebrow::before{content:'';width:28px;height:1px;background:var(--wine);}
  .section-head h2{font-size:clamp(2rem,4vw,3rem);font-weight:400;line-height:1.15;}
  .section-head p{margin-top:1.2rem;color:var(--grey);line-height:1.7;font-size:1.02rem;max-width:52ch;}

  .reveal{opacity:0;transform:translateY(28px);transition:opacity 0.9s ease, transform 0.9s ease;}
  .reveal.visible{opacity:1;transform:translateY(0);}

  /* ---------- THREAD SIGNATURE ---------- */
  .thread-wrap{position:relative;}
  .thread-line{
    position:absolute;left:24px;top:0;bottom:0;width:1px;
    background:linear-gradient(to bottom, transparent, var(--sand) 8%, var(--sand) 92%, transparent);
  }
  .thread-line .drop{
    position:absolute;left:50%;top:0;width:9px;height:9px;border-radius:50%;
    background:var(--wine);transform:translate(-50%,-50%);
    box-shadow:0 0 0 5px var(--paper);
  }
  .moments{display:flex;flex-direction:column;gap:3.2rem;padding-left:64px;position:relative;}
  .moment{position:relative;}
  .moment .num{
    position:absolute;left:-64px;top:0;width:48px;text-align:right;
    font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--sand);font-size:0.95rem;
  }
  .moment h3{font-size:1.3rem;font-weight:400;margin-bottom:0.5rem;}
  .moment p{color:var(--grey);line-height:1.7;max-width:56ch;font-size:0.98rem;}

  /* ---------- PORTFOLIO GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:14px;
  }
  .grid figure{position:relative;overflow:hidden;background:var(--ink);cursor:pointer;}
  .grid img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.16,.84,.44,1), filter .6s ease;}
  .grid figure:hover img{transform:scale(1.06);filter:saturate(1.1);}
  .grid figcaption{
    position:absolute;left:0;right:0;bottom:0;padding:1rem 1.2rem;
    background:linear-gradient(to top, rgba(14,14,14,0.75), transparent);
    color:#fff;font-size:0.78rem;letter-spacing:0.05em;
    opacity:0;transform:translateY(8px);transition:opacity .4s ease, transform .4s ease;
  }
  .grid figure:hover figcaption{opacity:1;transform:translateY(0);}
  .g1{grid-column:span 3;grid-row:span 2;}
  .g2{grid-column:span 3;grid-row:span 1;}
  .g3{grid-column:span 3;grid-row:span 1;}
  .g4{grid-column:span 2;grid-row:span 2;}
  .g5{grid-column:span 2;grid-row:span 2;}
  .g6{grid-column:span 2;grid-row:span 2;}
  .grid figure{aspect-ratio:1;}
  .g1{aspect-ratio:auto;}

  @media(max-width:820px){
    .grid{grid-template-columns:repeat(2,1fr);}
    .grid figure{grid-column:span 1 !important;aspect-ratio:1 !important;}
  }

  /* ---------- TESTIMONIALS ---------- */
  .testi-wrap{
    position:relative;background:var(--ink);color:#fff;
    border-radius:2px;padding:5rem 6vw;overflow:hidden;
  }
  .testi-wrap::before{
    content:'”';position:absolute;top:-2rem;left:2vw;font-family:'Cormorant Garamond',serif;font-size:16rem;
    color:rgba(255,255,255,0.05);line-height:1;
  }
  .testi-track{display:flex;transition:transform 0.7s cubic-bezier(.6,0,.2,1);}
  .testi{min-width:100%;max-width:680px;}
  .testi p{font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,2.4vw,1.7rem);line-height:1.5;font-weight:300;}
  .testi .who{margin-top:1.8rem;font-size:0.82rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--sand);}
  .testi-nav{display:flex;gap:10px;margin-top:2.6rem;position:relative;z-index:2;}
  .testi-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.3);border:none;cursor:pointer;transition:background .3s ease, transform .3s ease;}
  .testi-dot.active{background:var(--sand);transform:scale(1.3);}

  /* ---------- CONTACT ---------- */
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start;}
  @media(max-width:820px){.contact-grid{grid-template-columns:1fr;gap:3rem;}}
  .field{margin-bottom:1.6rem;}
  .field label{display:block;font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--grey);margin-bottom:0.6rem;}
  .field input, .field textarea{
    width:100%;border:none;border-bottom:1px solid var(--line);background:transparent;
    padding:0.6rem 0.2rem;font-family:'Jost',sans-serif;font-size:1rem;color:var(--ink);
    transition:border-color .3s ease;
  }
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--wine);}
  .field textarea{resize:vertical;min-height:100px;}
  .submit-btn{
    margin-top:1rem;padding:0.9rem 2.2rem;background:var(--wine);color:#fff;border:none;
    font-size:0.82rem;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;
    transition:background .3s ease, transform .3s ease;
  }
  .submit-btn:hover{background:#4a1420;transform:translateY(-2px);}
  .submit-btn:focus-visible, a:focus-visible, button:focus-visible{outline:2px solid var(--wine);outline-offset:3px;}

  .contact-info h3{font-size:1.6rem;font-weight:400;margin-bottom:1.4rem;}
  .contact-info p{color:var(--grey);line-height:1.7;margin-bottom:2rem;max-width:42ch;}
  .contact-info .line{padding:0.9rem 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:0.92rem;}
  .contact-info .line:last-child{border-bottom:1px solid var(--line);}

  footer{padding:3rem 6vw;text-align:center;color:var(--grey);font-size:0.8rem;border-top:1px solid var(--line);}
  .footer-cross{margin-top:0.7rem;}
  .footer-cross a{color:var(--grey);border-bottom:1px solid var(--line);padding-bottom:1px;transition:color .3s ease,border-color .3s ease;}
  .footer-cross a:hover{color:var(--wine);border-color:var(--wine);}
</style>
</head>
<body>

<nav id="nav">
  <a href="index.html" class="logo">Alex Sevoz</a>

<script>
  const translations = {
    pl: {
      page_title: "Alex Sevoz — Fotograf ślubny",
      nav_approach: "Podejście", nav_portfolio: "Portfolio", nav_avis: "Opinie", nav_contact: "Kontakt",
      hero_eyebrow: "FOTOGRAF ŚLUBNY — POLSKA I ZAGRANICA",
      hero_title: "Cicha nić<br>całego dnia.",
      hero_sub: "Dokumentuję śluby tak, jak podąża się za nicią: nie przerywając, pozwalając, by prawdziwe chwile same opowiedziały swoją historię.",
      scroll_cue: "Przewiń",
      approach_eyebrow: "Podejście",
      approach_h2: "Jeden dzień, jedna nić.",
      approach_p: "Żadnej wymuszonej reżyserii, żadnych sztywnych póz. Każdy ślub ma swoją własną narrację — ja po prostu za nią podążam, od przygotowań po ostatni taniec.",
      moment1_label: "Poranek", moment1_title: "Przygotowania",
      moment1_p: "Dzień zaczyna się spokojnie. Ubieranie, ostatnie poprawki, nerwowy śmiech i te ciche chwile spędzone z najbliższymi osobami. Jestem tam, by dokumentować to naturalnie, zanim zacznie się ceremonia.",
      moment2_label: "Południe", moment2_title: "Ceremonia",
      moment2_p: "Napięcie, pierwsze spojrzenie, przysięgi i reakcje otaczających Was ludzi. Zachowuję dyskretny dystans i pozwalam chwilom rozwijać się naturalnie.",
      moment3_label: "Popołudnie", moment3_title: "Przyjęcie",
      moment3_p: "Drinki, kolacja, rozmowy, uściski i czas spędzony z ludźmi, których zebraliście razem. Gdy dzień nabiera swojego rytmu, szukam momentów, które rodzą się naturalnie między tym wszystkim.",
      moment4_label: "Wieczór", moment4_title: "Zabawa",

  function setLang(lang){
    const dict = translations[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(dict[key] !== undefined) el.innerHTML = dict[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if(dict[key] !== undefined) el.setAttribute('placeholder', dict[key]);
    });
    document.getElementById('pageTitle').textContent = dict.page_title;
    document.getElementById('htmlRoot').setAttribute('lang', lang);
    document.querySelectorAll('.lang-switch button').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
  }

  document.querySelectorAll('.lang-switch button').forEach(btn => {
    btn.addEventListener('click', () => setLang(btn.getAttribute('data-lang')));
  });

  setLang('en');

  // sticky nav background on scroll
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 40);
  });

  // mobile menu
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
    navLinks.classList.toggle('open');
  });
  function closeMenu(){ navLinks.classList.remove('open'); }

  // scroll reveal
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
  }, {threshold:0.15});
  revealEls.forEach(el => io.observe(el));

  // testimonial carousel
  const track = document.getElementById('testiTrack');
  const testiNav = document.getElementById('testiNav');
  const total = track.children.length;
  let current = 0;
  for(let i=0;i<total;i++){
    const dot = document.createElement('button');
    dot.className = 'testi-dot' + (i===0 ? ' active' : '');
    dot.addEventListener('click', () => goTo(i));
    testiNav.appendChild(dot);
  }
  function goTo(i){
    current = i;
    track.style.transform = `translateX(-${i*100}%)`;
    [...testiNav.children].forEach((d,idx) => d.classList.toggle('active', idx===i));
  }
  setInterval(() => { goTo((current+1) % total); }, 6000);
</script>
